[project]
name = "osm-polygon-image-tag"
version = "0.1.0"
description = "Reproducible GeoParquet of OpenStreetMap polygons carrying image-reference tags."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Noé Flandre" }]
license = "Apache-2.0"
keywords = ["openstreetmap", "geoparquet", "geospatial", "dataset", "images"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "h3>=4.1,<5",
    "httpcore>=1,<2",
    "httpx>=0.28,<0.29",
    "huggingface-hub>=1.3,<2",
    "matplotlib>=3.10,<4",
    "osmium>=4.3,<5",
    "pyarrow>=21,<22",
    "pyproj>=3.7,<4",
    "pyyaml>=6,<7",
    "rich>=14,<15",
    "shapely>=2.1,<3",
    "tqdm>=4.67,<5",
    "typer>=0.16,<0.17",
]

[project.scripts]
osm-polygon-image-tag = "osm_polygon_image_tag.cli:run"

[project.urls]
Source = "https://github.com/NoeFlandre/osm-polygon-image-tag"
Issues = "https://github.com/NoeFlandre/osm-polygon-image-tag/issues"
Dataset = "https://huggingface.co/datasets/NoeFlandre/osm-polygon-image-tag"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_polygon_image_tag"]
include = [
    "src/osm_polygon_image_tag/README.md",
    "src/osm_polygon_image_tag/_data/*.json",
    "src/osm_polygon_image_tag/_data/*.cff",
    "src/osm_polygon_image_tag/_data/*.md",
    "src/osm_polygon_image_tag/_data/*.geojson",
    "src/osm_polygon_image_tag/_data/*.png",
    "src/osm_polygon_image_tag/*/README.md",
    "src/osm_polygon_image_tag/*/_data/*.geojson",
    "src/osm_polygon_image_tag/*/_data/*.json",
    "src/osm_polygon_image_tag/*/_data/*.md",
]

[dependency-groups]
dev = [
    "crap4py>=0.1,<0.2",
    "mkdocs-material>=9.6,<10",
    "mutmut>=3.7,<4",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<0.13",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib --cov=osm_polygon_image_tag --cov-report=term-missing"
markers = ["integration: requires the real osmium executable"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "TID"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["osm_polygon_image_tag"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mutmut]
source_paths = ["src"]
also_copy = [
    ".github",
    ".pre-commit-config.yaml",
    ".dockerignore",
    "CONTRIBUTING.md",
    "Dockerfile",
    "Justfile",
    "README.md",
    "citation.cff",
    "mkdocs.yml",
    "scripts",
]
pytest_add_cli_args = ["--no-cov"]
mutate_only_covered_lines = true
on_dependency_change = "rerun"
do_not_mutate_patterns = [
    "CREATE TABLE IF NOT EXISTS",
    "CREATE INDEX IF NOT EXISTS",
    "SELECT path, sha256 FROM asset_shards",
    "DELETE FROM asset_",
    "INSERT INTO asset_observations VALUES",
    "INSERT OR REPLACE INTO asset_shards VALUES",
    "cast\\(Any",
    "cast\\(list\\[Mapping",
    "typed_candidates = cast",
    "lambda _event: None",
    "image_url=cast",
]
