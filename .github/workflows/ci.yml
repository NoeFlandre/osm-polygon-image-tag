name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.11.16"

      - name: Install osmium-tool for integration tests
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::ForceIPv4=true
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          timeout --kill-after=30s 5m sudo apt-get "${apt_options[@]}" update
          timeout --kill-after=30s 5m sudo apt-get "${apt_options[@]}" install \
            -y --no-install-recommends osmium-tool
          osmium --version

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Sync locked dependencies
        run: uv sync --locked --dev

      - name: Run canonical quality gate
        run: just ci

      - name: Smoke test installed wheel
        run: |
          uv venv /tmp/osm-image-tag-wheel
          uv pip install --python /tmp/osm-image-tag-wheel/bin/python dist/*.whl
          /tmp/osm-image-tag-wheel/bin/osm-polygon-image-tag --help
          /tmp/osm-image-tag-wheel/bin/python -c "from importlib.resources import files; import osm_polygon_image_tag as p; assert p.__version__ == '0.1.0'; root = files('osm_polygon_image_tag'); assert root.joinpath('_data/osmium-export.json').read_text(); assert root.joinpath('_data/hero.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n'); assert root.joinpath('assets/README.md').read_text(); assert root.joinpath('resolvers/README.md').read_text()"

      - name: Verify no whitespace errors
        run: |
          git diff-tree --check --no-commit-id -r HEAD
          git diff --check origin/main...HEAD

  docker-smoke:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag osm-polygon-image-tag:ci .

      - name: Smoke-test direct CLI entrypoint
        run: docker run --rm --read-only --tmpfs /tmp osm-polygon-image-tag:ci --help
