repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: qa-gauntlet
        name: QA gauntlet
        entry: just qa
        language: system
        pass_filenames: false
        stages: [pre-push]
